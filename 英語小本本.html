<title>英語小本本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout concept: one narrow phone column. Each screen is a ribbon banner over a grid-paper notebook sheet,
   hand-drawn outlines, pastel fills taken from the three illustrations (shirt blue, blush pink, book green). */
:root{
  --desk:#e8eef0;
  --paper:#ffffff;
  --grid:#d8dcde;
  --ink:#2b2e30;
  --ink-soft:#5a6165;
  --shirt:#d6eaf0;
  --shirt-deep:#2d6a7e;
  --blush:#f7a9a9;
  --blush-soft:#fde6e6;
  --blush-deep:#a33a3a;
  --leaf:#e6efd6;
  --leaf-deep:#4d6a2c;
  --f-display:'Huninn','jf-openhuninn','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--desk);color:var(--ink);
  font:400 15px/1.65 var(--f-body);
  padding-block:12px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
button.panel{font:inherit;color:inherit;text-align:left}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp{width:32px;height:32px;border-radius:50%;border:1.8px solid var(--ink);display:grid;place-items:center;flex:none;background:var(--shirt)}
.stamp svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag{font-size:12px;padding:1px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--leaf);white-space:nowrap}
.tag.pink{background:var(--blush-soft)}
.tag.blue{background:var(--shirt)}

/* ribbon */
.ribbon{position:relative;height:68px;display:grid;place-items:center}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%}
.ribbon path{stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ribbon h1{position:relative;padding:0 54px;max-width:100%;text-align:center;text-wrap:balance;
  font:400 clamp(17px,5.4vw,22px)/1.25 var(--f-display);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* sheet */
.sheet{position:relative;min-height:380px;display:flex;flex-direction:column;gap:14px;padding:18px 16px 20px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px;
  border:1.6px solid #aab1b4}
.sheet.under-peek{padding-top:34px}
.peek{display:block;margin:0 auto -28px;height:96px;width:auto;position:relative;z-index:1}
.center{align-items:stretch;text-align:center}
.lead{font:400 26px/1.2 var(--f-display)}
.hint{color:var(--ink-soft)}
.sec{font:400 18px/1.3 var(--f-display);display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;border-top:1.6px dashed #9aa3a7}
.note{font-size:12px;color:var(--ink-soft);text-align:center}
.empty{padding:16px;text-align:center;color:var(--ink-soft);background:#fff;border:1.6px dashed #9aa3a7;border-radius:14px}

/* panels */
.panel{background:#fff;border:1.8px solid var(--ink);border-radius:16px 20px 15px 19px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.soft{background:var(--shirt)}
.panel.me-q{background:var(--leaf)}
.meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.reply{background:var(--blush-soft);border:1.6px solid var(--ink);border-radius:12px 15px 12px 14px;padding:10px 12px}
.reply b{font-weight:700;display:block;font-size:12.5px;color:var(--blush-deep)}

/* buttons */
.btn{font:500 16px/1 var(--f-body);min-height:46px;padding:0 20px;border:1.8px solid var(--ink);
  border-radius:24px 28px 25px 27px/27px 24px 28px 25px;background:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .12s}
.btn:hover{background:var(--shirt)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--shirt-deep);color:#fff}
.btn.pri:hover{background:#245668}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn.big{min-height:72px;font:400 22px/1 var(--f-display);flex:1}
.btn.dash{border-style:dashed;background:rgba(255,255,255,.85)}
.btn.warn{background:var(--blush-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--shirt-deep);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.two{display:flex;gap:12px}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label,.check{font-size:13.5px;color:var(--ink-soft)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.8px solid var(--ink);
  border-radius:12px 14px 12px 15px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
textarea{resize:vertical;min-height:92px;line-height:1.6}
.check{display:flex;align-items:center;gap:8px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--shirt-deep)}
.codebox{font:500 20px/1 var(--f-display);letter-spacing:.14em;text-align:center;max-width:150px;text-transform:uppercase}

/* avatars */
.avatars{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.av{width:52px;height:52px;border-radius:50%;border:1.8px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.av svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av.on{background:var(--shirt);box-shadow:0 0 0 3px var(--shirt-deep)}

/* home tiles */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;min-height:122px;padding:14px 12px;text-align:left;cursor:pointer;
  border:1.8px solid var(--ink);border-radius:26px 30px 24px 32px/30px 24px 32px 26px;
  display:flex;flex-direction:column;gap:4px;justify-content:center;background:var(--shirt);transition:transform .12s}
.tile:nth-child(3n+2){background:var(--leaf)}
.tile:nth-child(3n){background:var(--blush-soft)}
.tile:hover{transform:rotate(-1deg) translateY(-2px)}
.tile svg{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:400 21px/1.2 var(--f-display)}
.tile small{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.badge{position:absolute;top:-8px;right:-4px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--blush-deep);color:#fff;
  font:700 13px/26px var(--f-body);text-align:center;border:1.8px solid var(--ink)}
.badge[hidden]{display:none}

/* progress */
.meter{height:12px;border:1.6px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--leaf-deep);transition:width .4s}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto}
.foot .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.foot img{height:118px;width:auto;flex:none}
.readlabel{font:400 18px/1.2 var(--f-display)}

/* article */
.article h2{font:400 24px/1.3 var(--f-display);text-wrap:balance}
.article p+p{margin-top:.8em}
.article .body{font-size:16.5px;line-height:1.85;max-width:62ch}
.vocab{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.vocab dt{font-weight:700}
.vocab dd{margin:0;color:var(--ink-soft)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px}
.bubble{max-width:88%;padding:10px 13px;border:1.7px solid var(--ink);border-radius:16px 18px 16px 14px;overflow-wrap:anywhere}
.bubble p+p{margin-top:.5em}
.bubble.ai{align-self:flex-start;background:var(--shirt)}
.bubble.you{align-self:flex-end;background:var(--leaf)}
.bubble .fix{background:#fff;border-radius:8px;padding:4px 8px;font-size:14px;border:1.4px dashed var(--ink)}

/* draw */
.blob{width:min(78vw,280px);aspect-ratio:1;margin:4px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px;text-align:center;
  background:#fff;border:2px solid var(--ink);border-radius:52% 48% 55% 45%/48% 54% 46% 52%}
.blob .term{font:400 clamp(22px,7vw,30px)/1.25 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.blob .zh{font-size:17px}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border:1.7px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--shirt);box-shadow:0 0 0 2px var(--shirt-deep)}
.shake{animation:wob .12s infinite}
@keyframes wob{50%{transform:rotate(-1.5deg)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,380px);
  padding:10px 16px;background:var(--ink);color:#fff;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.grid2{gap:10px}.tile b{font-size:19px}}
</style>

<div id="toast" role="status" aria-live="polite"></div>

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var pad=function(n){return String(n).padStart(2,'0')};
var fmtTime=function(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
var toastTimer;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},2800)}
function empty(msg){return '<div class="empty">'+esc(msg)+'</div>'}
function paras(s){return String(s||'').split(/\n{1,}/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}
function weekKey(d){d=d||new Date();var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);var y=t.getUTCFullYear();var j=new Date(Date.UTC(y,0,4));var w=1+Math.round(((t-j)/864e5-3+((j.getUTCDay()+6)%7))/7);return y+'-W'+pad(w)}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}

var ARTICLES=[
 {id:'a1',tag:'設計',title:'Why White Space Matters',
  body:['When beginners design a poster, they often try to fill every corner. The page feels busy, and the viewer does not know where to look first. Experienced designers do the opposite. They leave empty areas on purpose, and we call this empty area white space.',
   'White space is not wasted space. It gives the eyes a place to rest, and it shows which elements belong together. A headline with room around it looks confident. A paragraph with generous margins feels easier to read. Even a small change, such as increasing the gap between two groups of text, can make a layout feel clearer.',
   'Try this exercise. Take one of your old projects and remove one element. Then increase the margins by ten percent. Compare the two versions and ask yourself: which one tells the story better? Many students are surprised that less really can say more.'],
  vocab:[['white space','留白'],['layout','版面配置'],['margin','邊界、留邊'],['element','元素'],['headline','標題'],['on purpose','故意地']]},
 {id:'a2',tag:'設計',title:'Choosing a Color Palette',
  body:['Color is one of the fastest ways to set a mood. Warm colors such as red and orange feel energetic, while cool colors such as blue and green feel calm. Before you pick any color, decide what feeling your design should create.',
   'A simple palette usually has three parts: one main color, one supporting color, and one accent. The main color covers most of the page. The supporting color adds variety, and the accent is saved for the things you want people to notice, like a button or a price.',
   'Contrast also matters. Light gray text on a white background may look elegant on your screen, but it is hard to read for many people. Always test your palette in different lighting, and ask a friend to look at it too. If they cannot read it quickly, change it.'],
  vocab:[['palette','色盤'],['mood','氛圍、情緒'],['accent','點綴色'],['contrast','對比'],['supporting','輔助的'],['elegant','優雅的']]},
 {id:'a3',tag:'設計',title:'Type That Does Not Get in the Way',
  body:['Good typography is a little like good lighting: you only notice it when it is wrong. The goal of body text is to be read easily, not to be admired. That is why many designers choose simple, familiar typefaces for long paragraphs.',
   'Three details make a big difference. First, line length: about 50 to 70 characters per line is comfortable. Second, leading, which is the space between lines; if it is too tight, the text looks crowded. Third, hierarchy, which means using size and weight to show what is most important.',
   'Save decorative fonts for short titles. When you use more than two typefaces on one page, the design can start to look confusing. Next time you read a magazine, look closely at how the headings and paragraphs differ. You will start to notice the small decisions behind every page.'],
  vocab:[['typography','字體排印'],['typeface','字型'],['leading','行距'],['hierarchy','層次'],['decorative','裝飾性的'],['crowded','擁擠的']]},
 {id:'a4',tag:'設計',title:'From Sketch to Prototype',
  body:['Every product starts as an idea, but an idea is hard to test. That is why designers sketch first. A sketch can be rough, and it only takes a few minutes. Its job is to show your thinking, not to look perfect.',
   'After a few sketches, many designers make a wireframe. A wireframe is a simple layout that shows where things go, with no color or pictures. Then they build a prototype, a model that people can click or hold. Testing a prototype with real users helps you find problems early, when they are still cheap to fix.',
   'Feedback can feel uncomfortable at first. Someone may say, "I do not understand this button." Try not to defend your work. Instead, ask why. Each round of feedback is called an iteration, and every iteration makes the design better.'],
  vocab:[['sketch','草圖'],['wireframe','線框圖'],['prototype','原型'],['feedback','回饋'],['iteration','迭代'],['defend','辯護']]},
 {id:'a5',tag:'日常',title:'A Morning at the Coffee Shop',
  body:['Mina walks into her favorite coffee shop at eight o’clock. The line is short today, so she does not have to wait long. "Good morning! What can I get for you?" the barista asks. "Hi! Could I have a medium latte, please?" Mina says.',
   '"Sure. For here or to go?" "To go, thanks. And can I have it with oat milk?" The barista nods and writes her name on the cup. While she waits, Mina checks her phone. She has a class at nine, and she still needs to finish her homework.',
   'A few minutes later, she hears her name. "Here you go. Have a great day!" "Thank you, you too!" Mina smiles and heads to school. Small conversations like this are a great way to practice English every day.'],
  vocab:[['barista','咖啡師'],['medium','中杯、中等的'],['for here or to go','內用或外帶'],['oat milk','燕麥奶'],['line','隊伍'],['head to','前往']]},
 {id:'a6',tag:'日常',title:'Taking the MRT in Taipei',
  body:['Taking the MRT is one of the easiest ways to get around Taipei. The trains are clean, they come often, and the signs are written in both Chinese and English. Most people use an EasyCard, so they can tap in and tap out without buying a ticket each time.',
   'There are a few simple rules. Stand on the right side of the escalator so others can walk past on the left. Let people get off the train before you get on. Please do not eat or drink inside the station. If you see someone who needs a seat, you can offer yours.',
   'If you get lost, do not worry. Staff at the information desk are happy to help. You can say, "Excuse me, how do I get to Taipei Main Station?" Listen for the line color and the direction, such as "Take the red line toward Tamsui."'],
  vocab:[['MRT','捷運'],['escalator','手扶梯'],['tap in','刷卡進站'],['seat','座位'],['information desk','服務台'],['direction','方向']]},
 {id:'a7',tag:'日常',title:'Why Sleep Helps You Learn',
  body:['Many students stay up late before an exam, but scientists say this is not a good plan. While you sleep, your brain organizes what you learned during the day. It moves important information into long-term memory and clears away the things you do not need.',
   'Most adults need seven to nine hours of sleep. If you sleep less, it becomes harder to focus, and you may feel stressed or forget simple things. A few habits can help: go to bed at the same time each night, keep your phone away from the bed, and avoid coffee in the evening.',
   'Next time you have a big deadline, try studying in shorter blocks and getting a full night of sleep. You may find that you remember more and feel calmer the next morning.'],

];

/* ---------- local fallback store (single device) ---------- */
var Local=(function(){
  var data=LS.get('eng:db',{});var watchers=[];
  var save=function(){LS.set('eng:db',data)};
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var segs=function(p){return p.split('/')};
  var merge=function(a,b){var o=Object.assign({},a);Object.keys(b).forEach(function(k){var x=b[k],y=a&&a[k];o[k]=(x&&typeof x==='object'&&!Array.isArray(x)&&y&&typeof y==='object'&&!Array.isArray(y))?merge(y,x):x});return o};
  var emit=function(){Promise.resolve().then(function(){watchers.slice().forEach(function(w){w()})})};
  var L={
    get:function(p){return data[p]?clone(data[p]):null},
    set:function(p,d){data[p]=clone(d);save();emit()},
    update:function(p,d){if(!data[p])throw {code:'invalid_argument'};data[p]=merge(data[p],clone(d));save();emit()},
    del:function(p){delete data[p];save();emit()},
    watchCol:function(col,cb){var n=segs(col).length+1;var f=function(){cb(Object.keys(data).filter(function(k){return k.indexOf(col+'/')===0&&segs(k).length===n}).map(function(k){return Object.assign({id:segs(k).pop()},clone(data[k]))}))};watchers.push(f);setTimeout(f,0);return function(){watchers=watchers.filter(function(x){return x!==f})}},
    watchDoc:function(p,cb){var f=function(){cb(L.get(p))};watchers.push(f);setTimeout(f,0);return function(){watchers=watchers.filter(function(x){return x!==f})}}
  };
  return L;
})();

var capsReady=(async function(){

  try{db=await c.use('db')}catch(e){db=null}

  if(db){
    try{var u=await c.use('user');var id=u?await u.id():null;if(id){me.uid=id}}catch(e){}
    mode='shared';
  }

})();

var S={
  get:async function(p){if(db){var s=await db.doc(p).get();return s.exists?Object.assign({},s.data()):null}return Local.get(p)},
  set:async function(p,d){if(db){return db.doc(p).set(d)}Local.set(p,d)},
  update:async function(p,d){if(db){return db.doc(p).update(d)}Local.update(p,d)},
  upsert:async function(p,d){if(db){var s=await db.doc(p).get();return s.exists?db.doc(p).update(d):db.doc(p).set(d)}if(Local.get(p)){Local.update(p,d)}else{Local.set(p,d)}},
  del:async function(p){if(db){return db.doc(p).delete()}Local.del(p)},
  id:function(col){return db?db.collection(col).doc().id:('l'+Math.random().toString(36).slice(2,9)+Date.now().toString(36))},
  col:function(p,cb){if(db){return db.collection(p).onSnapshot(function(s){cb(s.docs.map(function(x){return Object.assign({id:x.id},x.data())}))},function(){cb([])})}return Local.watchCol(p,cb)},
  doc:function(p,cb){if(db){return db.doc(p).onSnapshot(function(s){cb(s.exists?Object.assign({},s.data()):null)},function(){cb(null)})}return Local.watchDoc(p,cb)}
};

/* ---------- timer ---------- */
function stopTimer(){if(tm){clearInterval(tm);tm=null}}
function startTimer(refId,target,startMin){
  stopTimer();
  var secs=startMin*60,saved=startMin,done=startMin>=target,chain=Promise.resolve();
  function upd(){var m=Math.min(Math.floor(secs/60),target);var el=$('#rd-label');if(el)el.textContent='已閱讀 ('+m+'/'+target+' 分鐘)'+(done?' ✓':'');var b=$('#rd-bar');if(b)b.style.width=Math.min(100,secs/(target*60)*100)+'%'}
  upd();
  if(done)return;
  tm=setInterval(function(){
    if(document.visibilityState!=='visible')return;
    secs++;upd();
    var m=Math.floor(secs/60);
    if(m>saved){saved=m;if(m>=target){done=true;stopTimer();toast('讀完了，今天的閱讀達標！')}
      chain=chain.then(function(){return saveProgress(refId,Math.min(m,target),target,m>=target)})}
  },1000);
}
async function saveProgress(refId,minutes,target,done){
  try{await capsReady;var it={};it[refId]={minutes:minutes,target:target,done:done,at:Date.now()};await S.upsert(P('progress/'+me.uid),{uid:me.uid,name:me.name,items:it})}catch(e){toast(errText(e))}
}

  function drawForm(){
    $('#newbox').innerHTML=formOpen?
     '<div class="panel"><div class="field"><label for="lt">課程標題</label><input id="lt" type="text" maxlength="40" placeholder="例如：Unit 3 設計簡報用語"></div><div class="field"><label for="lb">課程內容</label><textarea id="lb" placeholder="點擊輸入文字（講義、單字、作業說明都可以）"></textarea></div><div class="field"><label for="ll">參考連結（選填）</label><input id="ll" type="text" placeholder="https://"></div><div class="field"><label for="lm">建議閱讀時間</label><select id="lm"><option>5</option><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div><div class="row"><button class="btn pri" data-act="saveLesson">確認派課</button><button class="btn" data-act="toggleNew">取消</button></div></div>':

    var pg={};cache.pg.forEach(function(p){pg[p.id]=p.items||{}});
    var ls=cache.ls.slice().sort(function(a,b){return b.createdAt-a.createdAt});
    if(!ls.length)return empty('還沒有派過課程。按上面的「新增課程」開始。');
    return ls.map(function(l){
      var done=members.filter(function(m){return pg[m.id]&&pg[m.id][l.id]&&pg[m.id][l.id].done}).length;
      var pct=members.length?Math.round(done/members.length*100):0;
      var rows=members.length?members.map(function(m){var it=pg[m.id]&&pg[m.id][l.id];return '<div class="row split"><span>'+esc(m.name)+'</span><span class="meta">'+(it?(it.done?'已讀完':it.minutes+'/'+(it.target||l.minutes)+' 分鐘'):'尚未開始')+'</span></div>'}).join(''):'<p class="meta">還沒有成員加入。</p>';

var chat=[],chatCtl=null;
var RULES='You are a friendly English conversation partner for Taiwanese design students (level A2 to B1). Reply in simple, natural English in 1 to 3 short sentences, then ask one easy follow-up question. If the student made a grammar or word-choice mistake, add one extra line that starts with "Fix:" showing the corrected sentence, followed by a very short explanation in Traditional Chinese. If the student writes in Chinese, say it in simple English first and invite them to repeat it. Never write long paragraphs.';
function setBubble(el,text){el.textContent='';String(text).split('\n').filter(function(l){return l.trim()}).forEach(function(line){var p=document.createElement('p');if(/^fix:/i.test(line))p.className='fix';p.textContent=line;el.append(p)})}
screens.ai=async function(){
  app.innerHTML=frame({title:'和AI說',role:role==='host'?'房主':'成員',back:'home',body:'<p class="hint">正在準備……</p>'});
  await capsReady;
  if(route.name!=='ai')return;
  var sheet=$('.sheet');
  if(!sample){sheet.innerHTML=empty('目前這個環境無法連到 AI。可以先用「抽籤」和「今週文章」練習。');return}
  sheet.innerHTML='<div class="chat" id="chat" aria-live="polite"></div><div class="seg" id="topics">'+['介紹我的作品','點一杯咖啡','說明設計想法','自由聊天'].map(function(t){return '<button data-act="topic" data-t="'+t+'">'+t+'</button>'}).join('')+'</div><div class="field"><label for="ci">想說什麼，用英文打打看</label><textarea id="ci" placeholder="今天想說什麼" style="min-height:70px"></textarea></div><div class="row"><button class="btn pri" id="csend" data-act="chatSend">送出</button><button class="btn" id="cstop" data-act="chatStop" hidden>停止</button><span class="meta">AI 會用你自己的 Claude 額度回覆</span></div>';
  var box=$('#chat');
  var hi=document.createElement('div');hi.className='bubble ai';setBubble(hi,'Hi! 今天想說什麼？\nWhat would you like to talk about today?');box.append(hi);
  chat.forEach(function(m){var b=document.createElement('div');b.className='bubble '+(m.role==='user'?'you':'ai');setBubble(b,m.content);box.append(b)});
  H.topic=function(t){var ci=$('#ci');ci.value={'介紹我的作品':'I want to introduce my project.','點一杯咖啡':'I want to practice ordering a coffee.','說明設計想法':'I want to explain my design idea.','自由聊天':'Let’s chat about my day.'}[t.dataset.t];ci.focus()};
  H.chatSend=async function(){
    var ci=$('#ci'),text=ci.value.trim();if(!text)return;
    ci.value='';
    var yb=document.createElement('div');yb.className='bubble you';setBubble(yb,text);box.append(yb);
    var ab=document.createElement('div');ab.className='bubble ai';ab.textContent='思考中……';box.append(ab);ab.scrollIntoView({block:'nearest'});
    chat.push({role:'user',content:text});
    var input=[{role:'user',content:RULES}].concat(chat.slice(-12));
    chatCtl=new AbortController();
    $('#csend').disabled=true;$('#cstop').hidden=false;
    try{
      var r=await sample(input,{modelTier:'quick',cache:false,signal:chatCtl.signal,onText:function(u){setBubble(ab,u.text);ab.scrollIntoView({block:'nearest'})}});
      chat.push({role:'assistant',content:r.text});
    }catch(e){
      if(e&&e.text){chat.push({role:'assistant',content:e.text});setBubble(ab,e.text)}else{chat.pop();ab.remove()}
      if(!e||e.code!=='cancelled'){toast(e&&e.code==='not_granted'?'你沒有允許使用 AI，所以無法對話':e&&e.code==='rate_limited'?'用得太頻繁了，等一下再試':'AI 暫時連不上，再試一次')}
    }finally{
      if($('#csend')){$('#csend').disabled=false;$('#cstop').hidden=true}
      chatCtl=null;
    }
  };
  H.chatStop=function(){if(chatCtl)chatCtl.abort()};
  cleanups.push(function(){if(chatCtl)chatCtl.abort()});
};

  makeCourse:async function(){
    var name=$('#cname').value.trim();if(!name){toast('請輸入課程名稱');return}
    var made=await act(async function(){
      var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=null;
      for(var k=0;k<6&&!code;k++){var c='';for(var i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];if(!(await S.get('courses/'+c)))code=c}
      if(!code)throw {code:'x'};
      var d={code:code,name:name,hostId:me.uid,hostName:me.name,createdAt:Date.now()};
      await S.set('courses/'+code,d);
      await S.set('courses/'+code+'/members/'+me.uid,{uid:me.uid,name:me.name,avatar:me.avatar,role:'host',joinedAt:Date.now()});
      return d;
    });
    if(made){course=made;role='host';rememberCourse();toast('課程建好了，代碼 '+made.code);go('home')}
  },
  joinCourse:async function(){
    var code=$('#ccode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast('代碼是 6 個英文字母或數字');return}
    var res=await act(async function(){
      var c=await S.get('courses/'+code);if(!c)return {miss:true};
      var r=c.hostId===me.uid?'host':'member';
      await S.upsert('courses/'+code+'/members/'+me.uid,{uid:me.uid,name:me.name,avatar:me.avatar,role:r,joinedAt:Date.now()});
      return {c:c,r:r};
    });
    if(!res)return;
    if(res.miss){toast('找不到這個代碼，請跟房主確認');return}
    course=res.c;role=res.r;rememberCourse();go('home');
  },
  openCourse:async function(t){
    var code=t.dataset.code;
    var res=await act(async function(){var c=await S.get('courses/'+code);if(!c)return {miss:true};var r=c.hostId===me.uid?'host':'member';await S.upsert('courses/'+code+'/members/'+me.uid,{uid:me.uid,name:me.name,avatar:me.avatar,role:r});return {c:c,r:r}});
    if(!res)return;
    if(res.miss){LS.set('eng:courses',myCourses().filter(function(x){return x.code!==code}));toast('這個課程已經不存在');screens.choose();return}
    course=res.c;role=res.r;rememberCourse();go('home');
  },
  openLesson:function(t){go('lessonRead',{id:t.dataset.id})},
  drawFilter:function(t){drawFilter=t.dataset.f;document.querySelectorAll('#seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===drawFilter)})},
  drawGo:function(){
    if(drawBusy)return;
    var pool=CARDS.filter(function(c){return drawFilter==='a'||c[0]===drawFilter});
    var pick=pool[Math.floor(Math.random()*pool.length)];
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ex=$('#ex'),blob=$('#blob'),btn=$('#drawbtn');
    var land=function(){blob.classList.remove('shake');showCard(pick);ex.hidden=false;ex.innerHTML='<div class="meta">例句</div><div style="font-size:16px">'+esc(pick[3])+'</div>';drawBusy=false;btn.disabled=false};
    drawBusy=true;btn.disabled=true;
    if(reduce){land();return}
    blob.classList.add('shake');ex.hidden=true;var n=0;
    var iv=setInterval(function(){showCard(pool[Math.floor(Math.random()*pool.length)]);if(++n>=9){clearInterval(iv);land()}},90);
    cleanups.push(function(){clearInterval(iv);drawBusy=false});
  }
};
/* handlers added by screens live on H too */

app.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||!app.contains(t))return;var f=H[t.dataset.act];if(f)f(t,e)});
app.addEventListener('input',function(e){var k=e.target&&e.target.dataset&&e.target.dataset.draft;if(k)drafts[k]=e.target.value});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&!e.isComposing){e.preventDefault();var f=H[e.target.dataset.enter];if(f)f(e.target,e)}});
app.addEventListener('focusout',function(){if(!pendingList)return;setTimeout(function(){if(pendingList&&curList)curList()},450)});

/* ---------- boot ---------- */
if(me.name){screens.choose();route={name:'choose'}}else{screens.welcome()}
})();
</script>
